<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="50%" stop-color="#12161f" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#edea46" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2430" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#141822" stop-opacity="0.9" />
    </linearGradient>
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#edea46" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <rect width="1200" height="675" fill="url(#gridPattern)" />

  <!-- Diagonal Tech Hazard Stripes -->
  <path d="M 1120 0 L 1200 0 L 1200 80 Z" fill="#edea46" fill-opacity="0.3" />
  <path d="M 1150 0 L 1200 0 L 1200 50 Z" fill="#edea46" />

  <!-- Header Banner -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="10" height="28" fill="#edea46" />
    <text x="24" y="22" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="#edea46" letter-spacing="2">AWS EKS &amp; GITOPS INFRASTRUCTURE</text>
    <text x="24" y="46" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8" letter-spacing="1">TERRAFORM IAC · OIDC ZERO-STATIC-KEYS · ECR · KUBERNETES HELM</text>
  </g>

  <!-- Diagram Nodes -->
  <!-- Node 1: GitHub Actions OIDC -->
  <g transform="translate(60, 150)">
    <rect width="280" height="150" rx="4" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect width="280" height="6" fill="#3b82f6" />
    <text x="20" y="38" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#ffffff">01. CI/CD AUTOMATION</text>
    <text x="20" y="60" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">GitHub Actions Workflows</text>
    <path d="M 20 78 L 260 78" stroke="#334155" stroke-width="1" />
    <text x="20" y="100" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">✓ OIDC AWS IAM Auth ($0)</text>
    <text x="20" y="122" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">✓ Multi-stage Docker Builds</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <path d="M 340 225 L 430 225" stroke="#edea46" stroke-width="2" stroke-dasharray="6,4" />
  <polygon points="434,225 426,220 426,230" fill="#edea46" />

  <!-- Node 2: AWS ECR Registry -->
  <g transform="translate(440, 150)">
    <rect width="320" height="150" rx="4" fill="url(#cardGrad)" stroke="#edea46" stroke-width="1.5" />
    <rect width="320" height="6" fill="#edea46" />
    <text x="20" y="38" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#edea46">02. CONTAINER REGISTRY</text>
    <text x="20" y="60" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">Amazon ECR (9 Repositories)</text>
    <path d="M 20 78 L 300 78" stroke="#334155" stroke-width="1" />
    <text x="20" y="100" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">Catalog · Order · Payment · Users</text>
    <text x="20" y="122" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">Gateway · Python Agent · Inngest</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <path d="M 760 225 L 850 225" stroke="#edea46" stroke-width="2" stroke-dasharray="6,4" />
  <polygon points="854,225 846,220 846,230" fill="#edea46" />

  <!-- Node 3: Amazon EKS Cluster -->
  <g transform="translate(860, 150)">
    <rect width="280" height="150" rx="4" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.5" />
    <rect width="280" height="6" fill="#f59e0b" />
    <text x="20" y="38" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#ffffff">03. COMPUTE &amp; ORCH</text>
    <text x="20" y="60" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">Amazon EKS Cluster v1.30</text>
    <path d="M 20 78 L 260 78" stroke="#334155" stroke-width="1" />
    <text x="20" y="100" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10b981">✓ Zero-Downtime Rollout</text>
    <text x="20" y="122" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">✓ Managed Node Groups</text>
  </g>

  <!-- Lower Row: Terraform IaC, Edge Security, In-Cluster Services -->
  <!-- Node 4: Terraform Infrastructure -->
  <g transform="translate(60, 360)">
    <rect width="320" height="230" rx="4" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="1.5" />
    <rect width="320" height="6" fill="#8b5cf6" />
    <text x="20" y="38" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#ffffff">TERRAFORM IAC MODULES</text>
    <text x="20" y="60" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">Declarative AWS Infrastructure</text>
    <path d="M 20 78 L 300 78" stroke="#334155" stroke-width="1" />
    <text x="20" y="105" font-family="'JetBrains Mono', monospace" font-size="12" fill="#c4b5fd">• Multi-AZ VPC + NAT Gateway</text>
    <text x="20" y="135" font-family="'JetBrains Mono', monospace" font-size="12" fill="#c4b5fd">• AWS IAM OIDC Identity Provider</text>
    <text x="20" y="165" font-family="'JetBrains Mono', monospace" font-size="12" fill="#c4b5fd">• AWS Application Load Balancer</text>
    <text x="20" y="195" font-family="'JetBrains Mono', monospace" font-size="12" fill="#c4b5fd">• Amazon RDS PostgreSQL 16</text>
  </g>

  <!-- Node 5: Cloudflare Edge Security -->
  <g transform="translate(420, 360)">
    <rect width="360" height="230" rx="4" fill="url(#cardGrad)" stroke="#f97316" stroke-width="1.5" />
    <rect width="360" height="6" fill="#f97316" />
    <text x="20" y="38" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#ffffff">CLOUDFLARE ZERO TRUST</text>
    <text x="20" y="60" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">Edge Wall Perimeter Security</text>
    <path d="M 20 78 L 340 78" stroke="#334155" stroke-width="1" />
    <text x="20" y="105" font-family="'JetBrains Mono', monospace" font-size="12" fill="#fed7aa">• Email OTP Authentication ($0)</text>
    <text x="20" y="135" font-family="'JetBrains Mono', monospace" font-size="12" fill="#fed7aa">• admin.yourdomain.com Protected</text>
    <text x="20" y="165" font-family="'JetBrains Mono', monospace" font-size="12" fill="#fed7aa">• DNS CNAME to AWS ALB DNS</text>
    <text x="20" y="195" font-family="'JetBrains Mono', monospace" font-size="12" fill="#fed7aa">• Complete Bot &amp; Port Scan Defense</text>
  </g>

  <!-- Node 6: In-Cluster Optimized Services -->
  <g transform="translate(820, 360)">
    <rect width="320" height="230" rx="4" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5" />
    <rect width="320" height="6" fill="#10b981" />
    <text x="20" y="38" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#ffffff">KUBERNETES MANIFESTS</text>
    <text x="20" y="60" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">In-Cluster Zero-SaaS Architecture</text>
    <path d="M 20 78 L 300 78" stroke="#334155" stroke-width="1" />
    <text x="20" y="105" font-family="'JetBrains Mono', monospace" font-size="12" fill="#a7f3d0">• Self-Hosted Inngest Workflow Pod</text>
    <text x="20" y="135" font-family="'JetBrains Mono', monospace" font-size="12" fill="#a7f3d0">• In-Cluster Redis 7 Caching Pod</text>
    <text x="20" y="165" font-family="'JetBrains Mono', monospace" font-size="12" fill="#a7f3d0">• AWS Load Balancer Controller</text>
    <text x="20" y="195" font-family="'JetBrains Mono', monospace" font-size="12" fill="#a7f3d0">• Zero-Downtime Rolling Restarts</text>
  </g>

  <!-- Bottom Terminal Tag -->
  <g transform="translate(60, 625)">
    <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#edea46" font-weight="700">STATUS: PRODUCTION LIVE</text>
    <text x="240" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">// PIPELINE EXECUTION: git push origin main ➔ AUTOMATIC EKS ROLLOUT</text>
  </g>
</svg>
